services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coincache
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: coincache
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coincache -d coincache"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Postgres is reachable only on the internal docker network —
    # no ports are published to the host on purpose.

  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://coincache:${DB_PASSWORD}@db:5432/coincache
      TZ: ${TZ:-Asia/Kolkata}
    depends_on:
      db:
        condition: service_healthy
    # The app is reachable only via Caddy — no ports published here either.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Empty DOMAIN in .env falls back to plain HTTP on :80
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  db_data:
  caddy_data:
  caddy_config:
